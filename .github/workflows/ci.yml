name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.1
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Warm Go build cache for the Playwright web server
        run: go build -o /dev/null ./cmd/server
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go vet ./...
      - run: npm test
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.4
      - name: Validate Helm chart
        run: bash test/helm-chart.sh
      - name: Build container image
        run: docker build --tag github-app-factory:${{ github.sha }} .
      - name: Container health smoke test
        run: |
          docker run --detach --name github-app-factory-container-test \
            --publish 127.0.0.1:3100:3000 \
            --mount type=tmpfs,destination=/data,tmpfs-mode=1777 \
            --env DATA_DIR=/data \
            --env INGEST_TOKEN=container-test-only \
            --env ALLOW_SIMULATE=true \
            github-app-factory:${{ github.sha }}
          trap 'docker rm -f github-app-factory-container-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs github-app-factory-container-test
          exit 1

  release:
    # Every merge to main publishes a versioned image + OCI Helm chart + GitHub Release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform, ui, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      CHART_DIR: charts/github-app-factory
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute release version
        id: version
        run: bash scripts/next-version.sh "$CHART_DIR/Chart.yaml" >> "$GITHUB_OUTPUT"
      - name: Resolve registry names
        if: steps.version.outputs.skip != 'true'
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/github-app-factory" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${owner}/github-app-factory-charts" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.names.outputs.image }}:sha-${{ steps.names.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: azure/setup-helm@v4
        if: steps.version.outputs.skip != 'true'
        with:
          version: v4.0.4
      - name: Package and push Helm chart
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/github-app-factory-${VERSION}.tgz" "$CHARTS"
      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.names.outputs.image }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: |
          cat > notes.md <<NOTES
          ## Artifacts

          | Artifact | Reference |
          | --- | --- |
          | Container image | \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64) |
          | Helm chart | \`${CHARTS}/github-app-factory\` version \`${VERSION}\` |
          | Commit | \`${GITHUB_SHA}\` |

          ## Install

          \`\`\`bash
          helm upgrade --install github-app-factory ${CHARTS}/github-app-factory \\
            --version ${VERSION} --namespace github-app-factory --create-namespace \\
            --values values-aks.yaml
          \`\`\`
          NOTES
          gh release create "v${VERSION}" "dist/github-app-factory-${VERSION}.tgz" \
            --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file notes.md --generate-notes
