name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files=$(git ls-tree -r --name-only "$HEAD_SHA")
          else
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          fi

          code_changed=false
          if [[ -n "$changed_files" ]]; then
            while IFS= read -r path; do
              case "$path" in
                *.md|docs/*|LICENSE|LICENSE-*|NOTICE|NOTICE-*) ;;
                *) code_changed=true; break ;;
              esac
            done <<< "$changed_files"
          fi

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  terraform:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.1
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
  ui:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Warm Go build cache for the Playwright web server
        run: go build -o /dev/null ./cmd/server
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  build:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go vet ./...
      - run: npm test
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.4
      - name: Validate Helm chart
        run: bash test/helm-chart.sh
      - name: Build container image
        run: docker build --tag octocraft:${{ github.sha }} .
      - name: Container health smoke test
        run: |
          docker run --detach --name octocraft-container-test \
            --publish 127.0.0.1:3100:3000 \
            --mount type=tmpfs,destination=/data,tmpfs-mode=1777 \
            --env DATA_DIR=/data \
            --env INGEST_TOKEN=container-test-only \
            --env ALLOW_SIMULATE=true \
            octocraft:${{ github.sha }}
          trap 'docker rm -f octocraft-container-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs octocraft-container-test
          exit 1

  release:
    # Code/build changes on main publish a versioned image + OCI Helm chart + GitHub Release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code_changed == 'true'
    needs: [changes, terraform, ui, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      CHART_DIR: charts/octocraft
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute release version
        id: version
        run: bash scripts/next-version.sh "$CHART_DIR/Chart.yaml" >> "$GITHUB_OUTPUT"
      - name: Resolve registry names
        if: steps.version.outputs.skip != 'true'
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/octocraft" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${owner}/octocraft-charts" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.names.outputs.image }}:sha-${{ steps.names.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: azure/setup-helm@v4
        if: steps.version.outputs.skip != 'true'
        with:
          version: v4.0.4
      - name: Package and push Helm chart
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/octocraft-${VERSION}.tgz" "$CHARTS"
      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.names.outputs.image }}
          CHARTS: ${{ steps.names.outputs.charts }}
        run: |
          cat > notes.md <<NOTES
          ## Artifacts

          | Artifact | Reference |
          | --- | --- |
          | Container image | \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64) |
          | Helm chart | \`${CHARTS}/octocraft\` version \`${VERSION}\` |
          | Commit | \`${GITHUB_SHA}\` |

          ## Install

          \`\`\`bash
          helm upgrade --install octocraft ${CHARTS}/octocraft \\
            --version ${VERSION} --namespace octocraft --create-namespace \\
            --values values-aks.yaml
          \`\`\`
          NOTES
          gh release create "v${VERSION}" "dist/octocraft-${VERSION}.tgz" \
            --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file notes.md --generate-notes
