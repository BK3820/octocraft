name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.1
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package function app
        run: |
          npm ci --omit=dev
          zip -qr release.zip host.json package.json src public node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: functionapp
          path: release.zip
          retention-days: 7

  approval-policy:
    if: vars.APP_FACTORY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, terraform, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: env } = await github.rest.repos.getEnvironment({
              ...context.repo, environment_name: 'production'
            });
            const rule = env.protection_rules.find(r => r.type === 'required_reviewers');
            if (!rule?.reviewers?.some(r => r.reviewer.login === 'BK3820') || env.can_admins_bypass !== false) {
              core.setFailed('Production must enforce BK3820 approval with admin bypass disabled. No deployment allowed.');
            }
  deploy:
    needs: [build, approval-policy]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_FACTORY_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: functionapp
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_FACTORY_URL }}/api/health")
            [ "$code" = "200" ] && echo "Healthy" && exit 0
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          exit 1
