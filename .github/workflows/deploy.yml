name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**', 'infra/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package function app
        run: |
          npm ci --omit=dev
          zip -qr release.zip host.json package.json src public node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: functionapp
          path: release.zip
          retention-days: 7

  deploy:
    if: vars.APP_FACTORY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: functionapp
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_FACTORY_URL }}/api/health")
            [ "$code" = "200" ] && echo "Healthy" && exit 0
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          exit 1
