name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.1
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go vet ./...
      - run: npm test
      - name: Package Go Function app
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/app .
          FUNCTIONS_WORKER_RUNTIME=native FUNCTIONS_CLI_NATIVE_LANGUAGE=go \
            npx --yes --package=azure-functions-core-tools@4.12.0 \
            func pack --no-build
          mv github-app-factory.zip release.zip
      - name: Build container image
        run: docker build --tag github-app-factory:${{ github.sha }} .
      - name: Container health smoke test
        run: |
          docker run --detach --name github-app-factory-container-test \
            --publish 127.0.0.1:3100:3000 \
            --mount type=tmpfs,destination=/data,tmpfs-mode=1777 \
            --env DATA_DIR=/data \
            --env INGEST_TOKEN=container-test-only \
            --env ALLOW_SIMULATE=true \
            github-app-factory:${{ github.sha }}
          trap 'docker rm -f github-app-factory-container-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs github-app-factory-container-test
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: functionapp
          path: release.zip
          retention-days: 7

  approval:
    # Plan-agnostic gate: works on GitHub Free private repos, where environment
    # required reviewers are unavailable. Opens an issue and waits for BK3820.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_FACTORY_ENABLED == 'true')
    needs: [build, terraform, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      issues: write
      contents: read
    steps:
      - uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: BK3820
          minimum-approvals: 1
          issue-title: "Deploy ${{ github.sha }} to production"
          issue-body: |
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Ref: `${{ github.ref }}` · Commit: `${{ github.sha }}` · Triggered by: @${{ github.actor }}

            Comment **approve** to deploy or **deny** to cancel.
          close-issue-means-denial: true
          fail-on-denial: true
  deploy:
    if: vars.APP_FACTORY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: [build, approval]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_FACTORY_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: functionapp
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_FACTORY_URL }}/api/health")
            [ "$code" = "200" ] && echo "Healthy" && exit 0
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          exit 1
