apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-app-factory.fullname" . }}
  labels:
    {{- include "github-app-factory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "github-app-factory.selectorLabels" . | nindent 4 }}
